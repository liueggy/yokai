name: Build debug APK
on:
  push:
    branches: ["feature/local-super-resolution"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Build
        run: ./gradlew :app:assembleStandardDebug --no-daemon --max-workers=2
      - name: Run enhancement unit tests
        run: ./gradlew :app:testStandardDebugUnitTest --tests "eu.kanade.tachiyomi.ui.reader.enhancement.*" --no-daemon
      - name: Locate APK
        run: find app/build/outputs/apk -type f -name '*.apk' -exec ls -lh {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: yokai-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
