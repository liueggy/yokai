name: Build debug APK
on:
  push:
    branches: ["feature/local-super-resolution"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Build
        run: ./gradlew :app:assembleStandardDebug --no-daemon --max-workers=2
      - name: Run enhancement unit tests
        run: ./gradlew :app:testStandardDebugUnitTest --tests "eu.kanade.tachiyomi.ui.reader.enhancement.*" --no-daemon
      - name: Locate APK
        id: locate
        run: |
          # Prefer a universally installable APK, then arm64, then anything.
          APK=$(find app/build/outputs/apk/standard -type f -name '*universal*.apk' | head -1)
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk/standard -type f -name '*arm64-v8a*.apk' | head -1)
          fi
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk/standard -type f -name '*.apk' | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "No APK found" >&2
            find app/build/outputs/apk -type f -name '*.apk' | head -5
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found: $APK ($(du -h "$APK" | cut -f1))"
      - name: Upload artifact (single APK)
        uses: actions/upload-artifact@v4
        with:
          name: yokai-sr-debug.apk
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
      - name: Create Release
        run: |
          APK_FILE="${{ steps.locate.outputs.path }}"
          TAG="sr-base-${{ github.run_number }}"
          gh release create "$TAG"             --title "Yokai SR Base v${{ github.run_number }}"             --prerelease             --generate-notes             "$APK_FILE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
